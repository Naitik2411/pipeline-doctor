services:
  postgres:
    image: postgres:16
    container_name: pipelinedoctor-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pipelinedoctor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pipelinedoctor}
      POSTGRES_DB: ${POSTGRES_DB:-pipelinedoctor}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pipelinedoctor} -d ${POSTGRES_DB:-pipelinedoctor}"]
      interval: 5s
      timeout: 5s
      retries: 10
  mock-api:
    build: .
    container_name: pipelinedoctor-mock-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pipelinedoctor}:${POSTGRES_PASSWORD:-pipelinedoctor}@postgres:5432/${POSTGRES_DB:-pipelinedoctor}
    depends_on:
      postgres:
        condition: service_healthy
